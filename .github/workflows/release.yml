name: Release Desktop Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.5.4). Leave empty to use commit SHA."
        required: false
        default: ""

permissions:
  contents: write

env:
  NODE_VERSION: "20"
  APP_NAME: "One"
  PORTABLE_NODE_VERSION: "20.18.1"

jobs:
  # =====================================================================
  # 1. 公共预备：构建 Next.js 独立产物 + CLI 包（cli/app/）
  #    把产物作为 artifact 上传，给两个平台 job 共用，避免重复构建
  # =====================================================================
  build-cli:
    name: Build CLI bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install root dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts || npm install --no-audit --no-fund --ignore-scripts

      - name: Install CLI dependencies
        run: npm install --no-audit --no-fund --ignore-scripts
        working-directory: cli

      - name: Build CLI (Next.js standalone + bundled app)
        run: node scripts/build-cli.js
        working-directory: cli

      - name: Generate tray icons from public/favicon.svg
        shell: bash
        run: |
          set -e
          echo "🎨 从 public/favicon.svg 生成托盘图标..."
          # 临时安装转换工具（不写入项目 package.json）
          npm install --no-save --no-audit --no-fund sharp@^0.33 png-to-ico@^2 2>&1 | tail -3
          node -e "
            const sharp = require('sharp');
            const pngToIco = require('png-to-ico');
            const fs = require('fs');
            const path = require('path');
            const svg = fs.readFileSync('public/favicon.svg');
            const trayDir = 'cli/src/cli/tray';

            (async () => {
              // 1) icon.png：256x256（systray on macOS/Linux）
              await sharp(svg, { density: 384 })
                .resize(256, 256, { fit: 'contain', background: { r:0, g:0, b:0, alpha:0 } })
                .png()
                .toFile(path.join(trayDir, 'icon.png'));
              console.log('✅ Generated icon.png (256x256)');

              // 2) icon.ico：Windows 多分辨率（16/32/48/64/256）
              const sizes = [16, 32, 48, 64, 256];
              const buffers = [];
              for (const s of sizes) {
                buffers.push(await sharp(svg, { density: 384 })
                  .resize(s, s, { fit: 'contain', background: { r:0, g:0, b:0, alpha:0 } })
                  .png()
                  .toBuffer());
              }
              const ico = await pngToIco(buffers);
              fs.writeFileSync(path.join(trayDir, 'icon.ico'), ico);
              console.log('✅ Generated icon.ico (' + sizes.join('/') + ')');
            })();
          "
          # 验证
          ls -la cli/src/cli/tray/icon.*
          test -s cli/src/cli/tray/icon.png && echo "✅ icon.png ok"
          test -s cli/src/cli/tray/icon.ico && echo "✅ icon.ico ok"

          

      - name: Ensure SQLite runtime is bundled (sql.js wasm + better-sqlite3 native)
        shell: bash
        run: |
          set -e
          # 1) sql.js：纯 JS + wasm，跨平台。必须把 dist/sql-wasm.wasm 也带上
          echo "📦 强制安装 sql.js 到 cli/app/node_modules ..."
          mkdir -p cli/app/node_modules
          cd cli/app
          # 用临时 package.json 避免污染 cli/app/package.json
          if [ ! -f package.json ]; then
            echo '{"name":"_bundled","private":true}' > package.json
          fi
          npm install sql.js@latest --no-audit --no-fund --no-save --prefer-online
          cd ../..
          # 验证 wasm 存在
          WASM="cli/app/node_modules/sql.js/dist/sql-wasm.wasm"
          if [ ! -f "$WASM" ]; then
            echo "❌ $WASM missing after install"
            ls -la cli/app/node_modules/sql.js/dist/ || true
            exit 1
          fi
          echo "✅ $WASM ($(stat -c%s "$WASM" 2>/dev/null || stat -f%z "$WASM") bytes)"

      - name: Prune build artifacts
        shell: bash
        run: |
          # 仅保留发布所需的目录
          rm -rf cli/.build-home cli/app/.next-cli-build/cache || true

      - name: Pack CLI bundle (preserve dotfiles/dot-dirs)
        shell: bash
        run: |
          set -euo pipefail
          # 直接 tar 打包，规避 actions/upload-artifact glob 对 .next-cli-build 等
          # 点开头目录的过滤问题
          tar -czf cli-bundle.tar.gz \
            cli/cli.js \
            cli/package.json \
            cli/LICENSE \
            cli/README.md \
            cli/src \
            cli/hooks \
            cli/app \
            cli/node_modules
          ls -lh cli-bundle.tar.gz

          # 列出 tar 全部内容到临时文件，避免 grep | head 触发的 SIGPIPE
          tar -tzf cli-bundle.tar.gz > /tmp/tar-list.txt
          echo "📦 tar 包内文件总数：$(wc -l < /tmp/tar-list.txt)"

          # 内容自检：关键文件清单
          echo "🔍 关键文件检查："
          for pat in "BUILD_ID" "node-machine-id/package.json" "sql.js/dist/sql-wasm.wasm"; do
            if grep -q "$pat" /tmp/tar-list.txt; then
              echo "   ✅ $pat"
            else
              echo "   ❌ $pat NOT IN ARCHIVE"
              exit 1
            fi
          done
          echo "✅ 所有关键文件都已打包"

      - name: Upload CLI bundle
        uses: actions/upload-artifact@v4
        with:
          name: cli-bundle
          path: cli-bundle.tar.gz
          if-no-files-found: error
          retention-days: 3

  # =====================================================================
  # 2. Windows x86 (x64)：用便携 Node + pkg 启动器，制作 ZIP + 安装目录
  # =====================================================================
  build-windows:
    name: Build Windows (x64) .exe
    needs: build-cli
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download CLI bundle
        uses: actions/download-artifact@v4
        with:
          name: cli-bundle
          path: .

      - name: Extract CLI bundle
        shell: bash
        run: |
          tar -xzf cli-bundle.tar.gz
          ls -la cli/
          # 验证关键文件
          test -f cli/app/.next-cli-build/BUILD_ID && echo "✅ BUILD_ID present" || { echo "❌ BUILD_ID missing"; exit 1; }
          test -d cli/node_modules/node-machine-id && echo "✅ node-machine-id present" || { echo "❌ node-machine-id missing"; exit 1; }
          test -f cli/app/node_modules/sql.js/dist/sql-wasm.wasm && echo "✅ sql-wasm.wasm present" || { echo "❌ sql-wasm.wasm missing"; exit 1; }

      - name: Read app version
        id: ver
        shell: pwsh
        run: |
          $pkg = Get-Content cli/package.json | ConvertFrom-Json
          "version=$($pkg.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Download portable Node.js (Windows x64)
        shell: pwsh
        run: |
          $ver = "${{ env.PORTABLE_NODE_VERSION }}"
          $url = "https://nodejs.org/dist/v$ver/node-v$ver-win-x64.zip"
          Invoke-WebRequest -Uri $url -OutFile node.zip
          Expand-Archive node.zip -DestinationPath .
          Rename-Item "node-v$ver-win-x64" "node-portable"

      - name: Install pkg
        run: npm install -g @yao-pkg/pkg

      - name: Compile launcher to .exe
        shell: pwsh
        run: |
          pkg scripts/desktop-launcher.js `
            --targets node20-win-x64 `
            --output "${{ env.APP_NAME }}.exe" `
            --compress GZip

      - name: Assemble release package
        shell: pwsh
        run: |
          $stage = "stage-win"
          New-Item -ItemType Directory -Force -Path "$stage/resources/node" | Out-Null
          New-Item -ItemType Directory -Force -Path "$stage/resources/cli" | Out-Null

          # 1) 启动器 exe
          Copy-Item "${{ env.APP_NAME }}.exe" "$stage/${{ env.APP_NAME }}.exe"

          # 2) 便携 Node
          Copy-Item -Recurse "node-portable/*" "$stage/resources/node/"

          # 3) CLI bundle（cli/cli.js + app/ + src/ + hooks/ + package.json + node_modules/）
          Copy-Item cli/cli.js "$stage/resources/cli/"
          Copy-Item cli/package.json "$stage/resources/cli/"
          if (Test-Path cli/LICENSE) { Copy-Item cli/LICENSE "$stage/resources/cli/" }
          if (Test-Path cli/README.md) { Copy-Item cli/README.md "$stage/resources/cli/" }
          Copy-Item -Recurse cli/src "$stage/resources/cli/src"
          Copy-Item -Recurse cli/hooks "$stage/resources/cli/hooks"
          Copy-Item -Recurse cli/app "$stage/resources/cli/app"
          if (Test-Path cli/node_modules) {
            Copy-Item -Recurse cli/node_modules "$stage/resources/cli/node_modules"
          }

      - name: Create ZIP archive
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          $zip = "${{ env.APP_NAME }}-$ver-windows-x64.zip"
          Compress-Archive -Path stage-win/* -DestinationPath $zip -CompressionLevel Optimal
          "asset=$zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        id: pack

      # ---------- MSI 安装包 ----------
      - name: Install WiX Toolset v4
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 4.0.5
          wix --version
          # 安装 UI 扩展（提供 WixUI_InstallDir 向导界面）
          wix extension add -g WixToolset.UI.wixext/4.0.5
          wix extension list -g

      - name: Generate WiX sources (Package.wxs + Files.wxs)
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          $appName = "${{ env.APP_NAME }}"

          # ---------- Files.wxs：枚举 stage-win 所有文件生成 Component ----------
          $stageRoot = (Resolve-Path "stage-win").Path
          $files = Get-ChildItem -Path $stageRoot -Recurse -File
          $sb = New-Object System.Text.StringBuilder
          [void]$sb.AppendLine('<?xml version="1.0" encoding="UTF-8"?>')
          [void]$sb.AppendLine('<Wix xmlns="http://wixtoolset.org/schemas/v4/wxs">')
          [void]$sb.AppendLine('  <Fragment>')
          [void]$sb.AppendLine('    <ComponentGroup Id="AppFiles" Directory="INSTALLFOLDER">')
          $i = 0
          foreach ($f in $files) {
            $i++
            $rel = $f.FullName.Substring($stageRoot.Length).TrimStart('\','/')
            $subdir = Split-Path $rel -Parent
            $subdirAttr = ""
            if ($subdir -and $subdir -ne "") {
              $subdirAttr = " Subdirectory=`"$subdir`""
            }
            $src = "stage-win\$rel"
            [void]$sb.AppendLine("      <Component Id=`"C$i`" Guid=`"*`"$subdirAttr>")
            [void]$sb.AppendLine("        <File Id=`"F$i`" Source=`"$src`" KeyPath=`"yes`" />")
            [void]$sb.AppendLine("      </Component>")
          }
          [void]$sb.AppendLine('    </ComponentGroup>')
          [void]$sb.AppendLine('  </Fragment>')
          [void]$sb.AppendLine('</Wix>')
          Set-Content -Path Files.wxs -Value $sb.ToString() -Encoding UTF8
          Write-Host "Generated Files.wxs with $i components"

          # ---------- Package.wxs：主包描述 ----------
          $wxs = @"
          <?xml version="1.0" encoding="UTF-8"?>
          <Wix xmlns="http://wixtoolset.org/schemas/v4/wxs"
               xmlns:ui="http://wixtoolset.org/schemas/v4/wxs/ui">
            <Package Name="$appName"
                     Manufacturer="$appName Project"
                     Version="$ver"
                     UpgradeCode="6F2B3C5E-9A8D-4E7B-9C1F-0123456789AB"
                     Scope="perMachine"
                     Compressed="yes"
                     InstallerVersion="500">
              <SummaryInformation Description="$appName Installer" />
              <MajorUpgrade DowngradeErrorMessage="A newer version of $appName is already installed." />
              <MediaTemplate EmbedCab="yes" CompressionLevel="high" />

              <!-- WixUI_InstallDir 向导：欢迎 → 许可 → 选路径 → 安装 → 完成 -->
              <ui:WixUI Id="WixUI_InstallDir" InstallDirectory="INSTALLFOLDER" />
              <UIRef Id="WixUI_ErrorProgressText" />

              <!-- "程序和功能" 元数据 -->
              <Property Id="ARPCONTACT" Value="$appName Project" />
              <Property Id="ARPHELPLINK" Value="https://github.com/${{ github.repository }}" />
              <Property Id="ARPURLINFOABOUT" Value="https://github.com/${{ github.repository }}" />
              <!-- 注意：ARPNOMODIFY / ARPNOREPAIR 已由 WixUI_InstallDir 内部定义，不能重复 -->

              <StandardDirectory Id="ProgramFiles64Folder">
                <Directory Id="INSTALLFOLDER" Name="$appName" />
              </StandardDirectory>

              <!-- 开始菜单快捷方式 -->
              <StandardDirectory Id="ProgramMenuFolder">
                <Directory Id="AppShortcutFolder" Name="$appName">
                  <Component Id="AppShortcut" Guid="7A1D9F2E-3B4C-4A5D-8E6F-AABBCCDDEEFF">
                    <Shortcut Id="AppStartMenuShortcut"
                              Name="$appName"
                              Description="Launch $appName"
                              Target="[INSTALLFOLDER]$appName.exe"
                              WorkingDirectory="INSTALLFOLDER" />
                    <RemoveFolder Id="RemoveAppShortcutFolder" On="uninstall" />
                    <RegistryValue Root="HKCU"
                                   Key="Software\$appName"
                                   Name="installed"
                                   Type="integer" Value="1" KeyPath="yes" />
                  </Component>
                </Directory>
              </StandardDirectory>

              <!-- 桌面快捷方式 -->
              <StandardDirectory Id="DesktopFolder">
                <Component Id="DesktopShortcut" Guid="3D8B4F1A-5C2E-4B7D-9F8E-CCDDEEFF1122">
                  <Shortcut Id="AppDesktopShortcut"
                            Name="$appName"
                            Description="Launch $appName"
                            Target="[INSTALLFOLDER]$appName.exe"
                            WorkingDirectory="INSTALLFOLDER" />
                  <RegistryValue Root="HKCU"
                                 Key="Software\$appName"
                                 Name="desktop"
                                 Type="integer" Value="1" KeyPath="yes" />
                </Component>
              </StandardDirectory>

              <Feature Id="Main" Title="$appName Core" Level="1" AllowAdvertise="no" Display="expand">
                <ComponentGroupRef Id="AppFiles" />
                <ComponentRef Id="AppShortcut" />
                <ComponentRef Id="DesktopShortcut" />
              </Feature>
            </Package>
          </Wix>
          "@
          Set-Content -Path Package.wxs -Value $wxs -Encoding UTF8

      - name: Build MSI
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          $msi = "${{ env.APP_NAME }}-$ver-windows-x64.msi"
          wix build -arch x64 -ext WixToolset.UI.wixext -out $msi Package.wxs Files.wxs
          if (!(Test-Path $msi)) { throw "MSI build failed: $msi not produced" }
          $info = Get-Item $msi
          Write-Host "✅ MSI built: $($info.Name)  $([math]::Round($info.Length/1MB,2)) MB"

          # 诊断：MSI 内部文件清单 + stage-win 原始大小对比
          $stageBytes = (Get-ChildItem -Recurse -File stage-win | Measure-Object -Property Length -Sum).Sum
          $stageCount = (Get-ChildItem -Recurse -File stage-win).Count
          Write-Host "📊 stage-win 原始大小：$([math]::Round($stageBytes/1MB,2)) MB （$stageCount 个文件）"
          Write-Host "📊 MSI 压缩后：$([math]::Round($info.Length/1MB,2)) MB"
          Write-Host "📊 压缩率：$([math]::Round($info.Length / $stageBytes * 100, 1))%"

          # 验证 Files.wxs 中 Component 数量与 stage-win 文件数一致
          $componentCount = (Select-String -Path Files.wxs -Pattern '<Component Id="C\d+').Count
          Write-Host "📊 Files.wxs 中 Component 数：$componentCount"
          if ($componentCount -ne $stageCount) {
            Write-Warning "⚠️ Component 数与文件数不一致！可能有文件漏打包"
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            ${{ env.APP_NAME }}-${{ steps.ver.outputs.version }}-windows-x64.zip
            ${{ env.APP_NAME }}-${{ steps.ver.outputs.version }}-windows-x64.msi
          if-no-files-found: error

  # =====================================================================
  # 3. macOS ARM (Apple Silicon)：.app bundle + .dmg
  # =====================================================================
  build-macos:
    name: Build macOS (ARM64) .dmg
    needs: build-cli
    runs-on: macos-14   # Apple Silicon runner
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download CLI bundle
        uses: actions/download-artifact@v4
        with:
          name: cli-bundle
          path: .

      - name: Extract CLI bundle
        run: |
          tar -xzf cli-bundle.tar.gz
          ls -la cli/
          test -f cli/app/.next-cli-build/BUILD_ID && echo "✅ BUILD_ID present" || { echo "❌ BUILD_ID missing"; exit 1; }
          test -d cli/node_modules/node-machine-id && echo "✅ node-machine-id present" || { echo "❌ node-machine-id missing"; exit 1; }
          test -f cli/app/node_modules/sql.js/dist/sql-wasm.wasm && echo "✅ sql-wasm.wasm present" || { echo "❌ sql-wasm.wasm missing"; exit 1; }

      - name: Read app version
        id: ver
        run: |
          VER=$(node -p "require('./cli/package.json').version")
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Download portable Node.js (macOS arm64)
        run: |
          VER="${{ env.PORTABLE_NODE_VERSION }}"
          curl -fsSLO "https://nodejs.org/dist/v$VER/node-v$VER-darwin-arm64.tar.gz"
          tar -xzf "node-v$VER-darwin-arm64.tar.gz"
          mv "node-v$VER-darwin-arm64" node-portable

      - name: Install pkg
        run: npm install -g @yao-pkg/pkg

      - name: Compile launcher (macOS arm64)
        run: |
          pkg scripts/desktop-launcher.js \
            --targets node20-macos-arm64 \
            --output "${{ env.APP_NAME }}" \
            --compress GZip

      - name: Generate macOS icon (.icns)
        run: |
          echo "🎨 生成 macOS .icns 图标..."
          npm install --no-save --no-audit --no-fund sharp@^0.33 2>&1 | tail -3
          node -e "
            const sharp = require('sharp');
            const fs = require('fs');
            const path = require('path');
            const svg = fs.readFileSync('public/favicon.svg');
            const iconsetDir = '/tmp/icon.iconset';

            (async () => {
              fs.mkdirSync(iconsetDir, { recursive: true });
              const sizes = [16, 32, 64, 128, 256, 512, 1024];
              for (const size of sizes) {
                const half = size / 2;
                await sharp(svg, { density: 384 })
                  .resize(size, size, { fit: 'contain', background: { r:0, g:0, b:0, alpha:0 } })
                  .png()
                  .toFile(path.join(iconsetDir, \`icon_\${size}x\${size}.png\`));
                if (half > 0) {
                  await sharp(svg, { density: 384 })
                    .resize(size, size, { fit: 'contain', background: { r:0, g:0, b:0, alpha:0 } })
                    .png()
                    .toFile(path.join(iconsetDir, \`icon_\${half}x\${half}@2x.png\`));
                }
              }
            })();
          "
          iconutil -c icns /tmp/icon.iconset -o /tmp/icon.icns
          ls -la /tmp/icon.icns && echo "✅ icon.icns generated"

      - name: Assemble .app bundle
        run: |
          APP="${{ env.APP_NAME }}.app"
          mkdir -p "$APP/Contents/MacOS"
          mkdir -p "$APP/Contents/Resources/one/node"
          mkdir -p "$APP/Contents/Resources/one/cli"

          # 启动器
          mv "${{ env.APP_NAME }}" "$APP/Contents/MacOS/${{ env.APP_NAME }}"
          chmod +x "$APP/Contents/MacOS/${{ env.APP_NAME }}"

          # 便携 Node
          cp -R node-portable/. "$APP/Contents/Resources/one/node/"

          # CLI bundle（含 node_modules）
          cp cli/cli.js "$APP/Contents/Resources/one/cli/"
          cp cli/package.json "$APP/Contents/Resources/one/cli/"
          [ -f cli/LICENSE ] && cp cli/LICENSE "$APP/Contents/Resources/one/cli/" || true
          [ -f cli/README.md ] && cp cli/README.md "$APP/Contents/Resources/one/cli/" || true
          cp -R cli/src "$APP/Contents/Resources/one/cli/src"
          cp -R cli/hooks "$APP/Contents/Resources/one/cli/hooks"
          cp -R cli/app "$APP/Contents/Resources/one/cli/app"
          if [ -d cli/node_modules ]; then
            cp -R cli/node_modules "$APP/Contents/Resources/one/cli/node_modules"
          fi

          # Info.plist
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>${{ env.APP_NAME }}</string>
            <key>CFBundleDisplayName</key><string>${{ env.APP_NAME }}</string>
            <key>CFBundleIdentifier</key><string>com.one.desktop</string>
            <key>CFBundleVersion</key><string>${{ steps.ver.outputs.version }}</string>
            <key>CFBundleShortVersionString</key><string>${{ steps.ver.outputs.version }}</string>
            <key>CFBundleExecutable</key><string>${{ env.APP_NAME }}</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>LSUIElement</key><false/>
            <key>NSHighResolutionCapable</key><true/>
            <key>CFBundleIconFile</key><string>icon.icns</string>
          </dict>
          </plist>
          PLIST

          # 复制应用图标到 Resources 目录
          cp /tmp/icon.icns "$APP/Contents/Resources/"

      - name: Ad-hoc codesign .app
        run: |
          # 自签名，避免 Gatekeeper 直接拒绝；用户首次运行仍需右键打开
          codesign --force --deep --sign - "${{ env.APP_NAME }}.app"
          codesign --verify --verbose=2 "${{ env.APP_NAME }}.app" || echo "⚠️ codesign verify reported issues"

      - name: Build .dmg
        run: |
          VER="${{ steps.ver.outputs.version }}"
          DMG="${{ env.APP_NAME }}-$VER-macos-arm64.dmg"
          STAGE=dmg-stage
          mkdir -p "$STAGE"
          cp -R "${{ env.APP_NAME }}.app" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "${{ env.APP_NAME }}" \
            -srcfolder "$STAGE" \
            -ov -format ULFO \
            "$DMG"

      - name: 🔍 Verify .dmg by mounting
        run: |
          VER="${{ steps.ver.outputs.version }}"
          DMG="${{ env.APP_NAME }}-$VER-macos-arm64.dmg"
          MOUNTPOINT=$(hdiutil attach "$DMG" -nobrowse -readonly | tail -1 | awk '{print $3}')
          echo "Mounted at: $MOUNTPOINT"
          ls -la "$MOUNTPOINT"
          test -d "$MOUNTPOINT/${{ env.APP_NAME }}.app" || { echo "❌ .app missing inside DMG"; hdiutil detach "$MOUNTPOINT"; exit 1; }
          # 验证签名链
          codesign --verify --verbose=2 "$MOUNTPOINT/${{ env.APP_NAME }}.app" || echo "⚠️ signature verify reported issues"
          # 关键文件存在性
          for f in "Contents/MacOS/${{ env.APP_NAME }}" "Contents/Info.plist" "Contents/Resources/one/cli/cli.js" "Contents/Resources/one/cli/app/server.js" "Contents/Resources/one/node/bin/node"; do
            test -e "$MOUNTPOINT/${{ env.APP_NAME }}.app/$f" && echo "✅ $f" || { echo "❌ Missing: $f"; hdiutil detach "$MOUNTPOINT"; exit 1; }
          done
          hdiutil detach "$MOUNTPOINT"
          echo "✅ DMG 内部结构校验通过"


      # =================================================================
      # 🔥 macOS 端到端验证：完整安装运行验证
      # =================================================================
      - name: 🔥 macOS E2E Full Verification
        id: e2e
        run: |
          set +e
          VER="${{ steps.ver.outputs.version }}"
          DMG="${{ env.APP_NAME }}-$VER-macos-arm64.dmg"
          APP_NAME="${{ env.APP_NAME }}"
          PORT=20128
          LOG="$RUNNER_TEMP/server.log"
          mkdir -p "$RUNNER_TEMP/verify"

          echo "===== Step 1/6: 挂载 DMG 文件 ====="
          MOUNTPOINT=$(hdiutil attach "$DMG" -nobrowse -readonly 2>/dev/null | tail -1 | awk '{print $3}')
          if [ -z "$MOUNTPOINT" ]; then
            echo "❌ 无法挂载 DMG 文件"
            screencapture -x -t png "$RUNNER_TEMP/verify/00-mount-failed.png" || true
            exit 1
          fi
          echo "✅ DMG 挂载成功: $MOUNTPOINT"
          ls -la "$MOUNTPOINT"

          echo "===== Step 2/6: 复制应用到 /Applications ====="
          if [ ! -d "$MOUNTPOINT/$APP_NAME.app" ]; then
            echo "❌ DMG 中找不到应用"
            hdiutil detach "$MOUNTPOINT"
            screencapture -x -t png "$RUNNER_TEMP/verify/01-app-missing.png" || true
            exit 1
          fi
          sudo rm -rf "/Applications/$APP_NAME.app" 2>/dev/null || true
          cp -R "$MOUNTPOINT/$APP_NAME.app" /Applications/
          if [ ! -d "/Applications/$APP_NAME.app" ]; then
            echo "❌ 复制应用失败"
            hdiutil detach "$MOUNTPOINT"
            screencapture -x -t png "$RUNNER_TEMP/verify/02-copy-failed.png" || true
            exit 1
          fi
          echo "✅ 应用已安装到 /Applications"
          hdiutil detach "$MOUNTPOINT"

          echo "===== Step 3/6: 启动应用 ====="
          APP_BIN="/Applications/$APP_NAME.app/Contents/MacOS/$APP_NAME"
          echo "▶️ 后台启动 $APP_BIN ..."
          script -q /dev/null "$APP_BIN" --log --port $PORT > "$LOG" 2>&1 &
          PID=$!
          echo "启动 PID=$PID"

          echo "⏳ 轮询端口 $PORT（最多 120s）..."
          UP=0
          for i in $(seq 1 120); do
            if curl -fsS "http://127.0.0.1:$PORT/" -o /dev/null 2>/dev/null; then
              echo "✅ Server up after ${i}s"
              UP=1
              break
            fi
            if ! kill -0 $PID 2>/dev/null; then
              echo "❌ 应用进程提前退出"
              break
            fi
            sleep 1
          done

          if [ "$UP" != "1" ]; then
            echo "❌ HTTP 端点超时未就绪"
            echo "---- 服务日志（后 200 行）----"
            tail -200 "$LOG" || true
            cp "$LOG" "$RUNNER_TEMP/verify/server.log" 2>/dev/null || true
            screencapture -x -t png "$RUNNER_TEMP/verify/03-server-failed.png" 2>/dev/null || true
            kill $PID 2>/dev/null
            pkill -f "$APP_NAME.app" 2>/dev/null || true
            exit 1
          fi

          echo "===== Step 4/6: 验证 HTTP 服务 ====="
          echo "🔎 校验关键路由"
          set -e
          curl -fsS -o "$RUNNER_TEMP/verify/home.html" "http://127.0.0.1:$PORT/"
          curl -fsS -o "$RUNNER_TEMP/verify/dashboard.html" "http://127.0.0.1:$PORT/dashboard" || echo "⚠️ /dashboard 非 2xx"
          curl -fsS -o "$RUNNER_TEMP/verify/favicon.svg" "http://127.0.0.1:$PORT/favicon.svg" || true
          set +e

          echo "===== Step 5/6: 截图记录 ====="
          echo "📸 截图 1: 应用启动后"
          screencapture -x -t png "$RUNNER_TEMP/verify/04-app-running.png" || true

          echo "📸 截图 2: 使用 open 命令启动后的界面"
          open -ga "/Applications/$APP_NAME.app" 2>/dev/null || true
          sleep 5
          screencapture -x -t png "$RUNNER_TEMP/verify/05-app-opened.png" || true

          echo "📸 截图 3: 服务运行状态"
          sleep 2
          screencapture -x -t png "$RUNNER_TEMP/verify/06-service-status.png" || true

          echo "===== Step 6/6: 清理与报告 ====="
          echo "---- 服务日志（后 60 行）----"
          tail -60 "$LOG" || true
          cp "$LOG" "$RUNNER_TEMP/verify/server.log" || true

          echo "📝 生成验证报告"
          cat > "$RUNNER_TEMP/verify/verification-report.txt" <<REPORT
          ========================================
          $APP_NAME macOS 验证报告
          ========================================
          版本: $VER
          日期: $(date)
          状态: ✅ 通过

          验证步骤:
          1. ✅ DMG 文件挂载成功
          2. ✅ 应用安装到 /Applications
          3. ✅ 应用启动成功
          4. ✅ HTTP 服务正常运行 (端口 $PORT)
          5. ✅ 关键路由验证通过
          6. ✅ 界面截图完成

          服务日志位置: server.log
          截图位置: 04-app-running.png, 05-app-opened.png, 06-service-status.png
          ========================================
          REPORT

          echo "🧹 优雅退出"
          kill $PID 2>/dev/null
          for i in 1 2 3 4 5; do
            kill -0 $PID 2>/dev/null || break
            sleep 1
          done
          kill -9 $PID 2>/dev/null || true
          pkill -f "$APP_NAME.app" 2>/dev/null || true

          echo "✅ macOS 完整验证通过"


      - name: 📸 Upload macOS verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-verification-${{ steps.ver.outputs.version }}
          path: ${{ runner.temp }}/verify/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: "${{ env.APP_NAME }}-${{ steps.ver.outputs.version }}-macos-arm64.dmg"
          if-no-files-found: error

  # =====================================================================
  # 5. Windows x64 Electron 构建
  # =====================================================================
  build-windows-electron:
    name: Build Windows (x64) Electron
    needs: build-cli
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download CLI bundle
        uses: actions/download-artifact@v4
        with:
          name: cli-bundle
          path: .

      - name: Extract CLI bundle
        shell: bash
        run: tar -xzf cli-bundle.tar.gz

      - name: Read app version
        id: ver
        shell: pwsh
        run: |
          $pkg = Get-Content cli/package.json | ConvertFrom-Json
          "version=$($pkg.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Download portable Node.js
        shell: pwsh
        run: |
          $ver = "${{ env.PORTABLE_NODE_VERSION }}"
          $url = "https://nodejs.org/dist/v$ver/node-v$ver-win-x64.zip"
          Invoke-WebRequest -Uri $url -OutFile node.zip
          Expand-Archive node.zip -DestinationPath .
          Rename-Item "node-v$ver-win-x64" "node-portable"

      - name: Install Electron dependencies
        run: npm install --no-audit --no-fund
        working-directory: electron

      - name: Generate icons for Electron
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $srcPng = "assemblyai-color.png"
          if(-not (Test-Path $srcPng)) {
            Write-Host "Generating default icon..."
            $bmp = New-Object System.Drawing.Bitmap(256, 256)
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.Clear([System.Drawing.Color]::FromArgb(51, 153, 51))
            $g.Dispose()
            $bmp.Save($srcPng, [System.Drawing.Imaging.ImageFormat]::Png)
            $bmp.Dispose()
          }
          $buildDir = "build"
          New-Item -ItemType Directory -Force -Path $buildDir | Out-Null
          $sizes = @(16, 32, 48, 64, 128, 256)
          foreach($s in $sizes) {
            $bmp = New-Object System.Drawing.Bitmap($s, $s)
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
            $img = [System.Drawing.Image]::FromFile($srcPng)
            $g.DrawImage($img, 0, 0, $s, $s)
            $g.Dispose()
            $img.Dispose()
            $bmp.Save("$buildDir/icon-$s.png", [System.Drawing.Imaging.ImageFormat]::Png)
            $bmp.Dispose()
          }
          Copy-Item "$buildDir/icon-256.png" "$buildDir/icon.png" -Force
          $fs = New-Object System.IO.FileStream("$buildDir/icon.ico", [System.IO.FileMode]::Create)
          $bw = New-Object System.IO.BinaryWriter($fs)
          $count = $sizes.Count
          $bw.Write([UInt16]0)
          $bw.Write([UInt16]1)
          $bw.Write([UInt16]$count)
          $offset = 6 + ($count * 16)
          for($i=0; $i -lt $count; $i++) {
            $size = $sizes[$i]
            $pngPath = "$buildDir/icon-$size.png"
            $pngBytes = [System.IO.File]::ReadAllBytes($pngPath)
            $sizeByte = if($size -ge 256) { [Byte]0 } else { [Byte]$size }
            $bw.Write($sizeByte)
            $bw.Write($sizeByte)
            $bw.Write([Byte]0)
            $bw.Write([Byte]0)
            $bw.Write([UInt16]1)
            $bw.Write([UInt16]32)
            $bw.Write([UInt32]$pngBytes.Length)
            $bw.Write([UInt32]$offset)
            $offset += $pngBytes.Length
          }
          for($i=0; $i -lt $count; $i++) {
            $size = $sizes[$i]
            $pngPath = "$buildDir/icon-$size.png"
            $pngBytes = [System.IO.File]::ReadAllBytes($pngPath)
            $bw.Write($pngBytes)
          }
          $bw.Close()
          $fs.Close()
          Write-Host "✅ Icons generated"

      - name: Prepare Electron resources
        shell: pwsh
        run: |
          $resDir = "electron/resources"
          New-Item -ItemType Directory -Force -Path "$resDir/cli" | Out-Null
          New-Item -ItemType Directory -Force -Path "$resDir/node" | Out-Null
          New-Item -ItemType Directory -Force -Path "$resDir/build" | Out-Null

          Copy-Item cli/cli.js "$resDir/cli/"
          Copy-Item cli/package.json "$resDir/cli/"
          if (Test-Path cli/LICENSE) { Copy-Item cli/LICENSE "$resDir/cli/" }
          if (Test-Path cli/README.md) { Copy-Item cli/README.md "$resDir/cli/" }
          Copy-Item -Recurse cli/src "$resDir/cli/src"
          Copy-Item -Recurse cli/hooks "$resDir/cli/hooks"
          Copy-Item -Recurse cli/app "$resDir/cli/app"
          if (Test-Path cli/node_modules) {
            Copy-Item -Recurse cli/node_modules "$resDir/cli/node_modules"
          }
          Copy-Item -Recurse "node-portable/*" "$resDir/node/"
          Copy-Item build/icon.ico "$resDir/build/"
          Copy-Item build/icon.png "$resDir/build/"
          Copy-Item build/icon-*.png "$resDir/build/" -ErrorAction SilentlyContinue

      - name: Build Electron MSI
        shell: pwsh
        run: |
          npm run build:win
        working-directory: electron

      - name: Rename artifact
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          $pattern = "electron/dist/One-$ver-windows-x64-setup*.exe"
          $src = Get-ChildItem $pattern -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($src) {
            $dst = "One-$ver-windows-x64-electron.exe"
            Move-Item $src.FullName $dst
            Write-Host "✅ Renamed to $dst"
          } else {
            Write-Host "❌ No Electron build output found"
            Get-ChildItem electron/dist/*.exe -ErrorAction SilentlyContinue
          }

      - name: Upload Windows Electron artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-electron
          path: "${{ env.APP_NAME }}-${{ steps.ver.outputs.version }}-windows-x64-electron.exe"
          if-no-files-found: error

  # =====================================================================
  # 6. macOS arm64 Electron 构建
  # =====================================================================
  build-macos-electron:
    name: Build macOS (arm64) Electron
    needs: build-cli
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download CLI bundle
        uses: actions/download-artifact@v4
        with:
          name: cli-bundle
          path: .

      - name: Extract CLI bundle
        run: tar -xzf cli-bundle.tar.gz

      - name: Read app version
        id: ver
        run: |
          ver=$(node -e "console.log(require('./cli/package.json').version)")
          echo "version=$ver" >> $GITHUB_OUTPUT

      - name: Download portable Node.js
        run: |
          ver="${{ env.PORTABLE_NODE_VERSION }}"
          curl -fsSLO "https://nodejs.org/dist/v$ver/node-v$ver-darwin-arm64.tar.gz"
          tar -xzf "node-v$ver-darwin-arm64.tar.gz"
          mv "node-v$ver-darwin-arm64" node-portable

      - name: Install Electron dependencies
        run: npm install --no-audit --no-fund
        working-directory: electron

      - name: Generate icons for Electron
        run: |
          if [ ! -f "assemblyai-color.png" ]; then
            echo "Generating default icon..."
            python3 scripts/generate-icons.py .
          fi
          mkdir -p build
          # 使用 sips 生成不同尺寸
          for size in 16 32 48 64 128 256 512; do
            sips -z $size $size assemblyai-color.png --out "build/icon-$size.png" 2>/dev/null || cp assemblyai-color.png "build/icon-$size.png"
          done
          cp build/icon-256.png build/icon.png
          # 生成 icns (macOS)
          if command -v iconutil &> /dev/null; then
            mkdir -p build/iconset
            cp build/icon-16.png build/iconset/icon_16x16.png
            cp build/icon-32.png build/iconset/icon_16x16@2x.png
            cp build/icon-32.png build/iconset/icon_32x32.png
            cp build/icon-64.png build/iconset/icon_32x32@2x.png
            cp build/icon-128.png build/iconset/icon_128x128.png
            cp build/icon-256.png build/iconset/icon_128x128@2x.png
            cp build/icon-256.png build/iconset/icon_256x256.png
            cp build/icon-512.png build/iconset/icon_256x256@2x.png
            iconutil -c icns build/iconset -o build/icon.icns 2>/dev/null || true
            rm -rf build/iconset
          fi
          echo "✅ Icons generated"

      - name: Prepare Electron resources
        run: |
          resDir="electron/resources"
          mkdir -p "$resDir/cli" "$resDir/node" "$resDir/build"
          cp cli/cli.js "$resDir/cli/"
          cp cli/package.json "$resDir/cli/"
          [ -f cli/LICENSE ] && cp cli/LICENSE "$resDir/cli/"
          [ -f cli/README.md ] && cp cli/README.md "$resDir/cli/"
          cp -R cli/src "$resDir/cli/src"
          cp -R cli/hooks "$resDir/cli/hooks"
          cp -R cli/app "$resDir/cli/app"
          [ -d cli/node_modules ] && cp -R cli/node_modules "$resDir/cli/node_modules"
          cp -R node-portable/* "$resDir/node/"
          cp build/icon.png "$resDir/build/"
          cp build/icon-*.png "$resDir/build/" 2>/dev/null || true
          [ -f build/icon.icns ] && cp build/icon.icns "$resDir/build/" || true

      - name: Build Electron DMG
        run: npm run build:mac
        working-directory: electron

      - name: Rename artifact
        run: |
          ver="${{ steps.ver.outputs.version }}"
          pattern="electron/dist/One-$ver-macos-arm64*.dmg"
          src=$(ls -t $pattern 2>/dev/null | head -1)
          if [ -n "$src" ]; then
            dst="One-$ver-macos-arm64-electron.dmg"
            mv "$src" "$dst"
            echo "✅ Renamed to $dst"
          else
            echo "❌ No Electron build output found"
            ls -la electron/dist/*.dmg 2>/dev/null || true
          fi

      - name: 🔍 Verify Electron DMG by mounting
        run: |
          set -e
          VER="${{ steps.ver.outputs.version }}"
          APP="${{ env.APP_NAME }}"
          DMG="$(pwd)/$APP-$VER-macos-arm64-electron.dmg"
          echo "DMG path: $DMG"
          ls -la "$DMG"
          RAW=$(hdiutil attach "$DMG" -nobrowse -readonly 2>&1)
          echo "hdiutil output:"
          echo "$RAW"
          # Try the simple awk parsing first; fallback to grep-based lookup
          MOUNTPOINT=$(echo "$RAW" | tail -1 | awk '{print $3}')
          if [ -z "$MOUNTPOINT" ] || [ ! -d "$MOUNTPOINT" ]; then
            DEV=$(echo "$RAW" | head -1 | awk '{print $1}')
            echo "Primary parsing failed (MOUNTPOINT=$MOUNTPOINT DEV=$DEV); falling back to mount lookup"
            MOUNTPOINT=$(mount | grep -F "$DEV" | awk '{print $3}')
          fi
          if [ -z "$MOUNTPOINT" ] || [ ! -d "$MOUNTPOINT" ]; then
            # Final fallback: search /Volumes for our .app
            MOUNTPOINT=""
            for p in /Volumes/*; do
              if [ -d "$p/$APP.app" ]; then MOUNTPOINT="$p"; break; fi
            done
          fi
          echo "Mounted at: $MOUNTPOINT"
          test -n "$MOUNTPOINT" || { echo "❌ Failed to resolve mount point"; exit 1; }
          test -d "$MOUNTPOINT/$APP.app" || { echo "❌ $APP.app missing inside DMG"; hdiutil detach "$MOUNTPOINT"; exit 1; }
          codesign --verify --verbose=2 "$MOUNTPOINT/$APP.app" || echo "⚠️ signature verify reported issues"
          for f in "Contents/MacOS/$APP" "Contents/Info.plist" "Contents/Resources/app.asar"; do
            test -e "$MOUNTPOINT/$APP.app/$f" && echo "✅ $f" || echo "⚠️ Missing: $f"
          done
          hdiutil detach "$MOUNTPOINT"
          echo "✅ Electron DMG internal structure verification passed"

      - name: 🔥 Electron macOS E2E Verification
        id: e2e-electron
        run: |
          set +e
          VER="${{ steps.ver.outputs.version }}"
          APP_NAME="${{ env.APP_NAME }}"
          DMG="$(pwd)/$APP_NAME-$VER-macos-arm64-electron.dmg"
          PORT=20128
          LOG="$RUNNER_TEMP/electron-server.log"
          mkdir -p "$RUNNER_TEMP/electron-verify"

          echo "===== Step 1/6: Mount DMG ====="
          RAW=$(hdiutil attach "$DMG" -nobrowse -readonly 2>&1)
          echo "hdiutil output: $RAW"
          MOUNTPOINT=$(echo "$RAW" | tail -1 | awk '{print $3}')
          if [ -z "$MOUNTPOINT" ] || [ ! -d "$MOUNTPOINT" ]; then
            DEV=$(echo "$RAW" | head -1 | awk '{print $1}')
            MOUNTPOINT=$(mount | grep -F "$DEV" | awk '{print $3}')
          fi
          if [ -z "$MOUNTPOINT" ] || [ ! -d "$MOUNTPOINT" ]; then
            for p in /Volumes/*; do
              if [ -d "$p/$APP_NAME.app" ]; then MOUNTPOINT="$p"; break; fi
            done
          fi
          if [ -z "$MOUNTPOINT" ] || [ ! -d "$MOUNTPOINT" ]; then
            echo "❌ Cannot mount DMG"
            exit 1
          fi
          echo "✅ DMG mounted: $MOUNTPOINT"

          echo "===== Step 2/6: Copy app to /Applications ====="
          sudo rm -rf "/Applications/$APP_NAME.app" 2>/dev/null || true
          cp -R "$MOUNTPOINT/$APP_NAME.app" /Applications/
          hdiutil detach "$MOUNTPOINT"
          echo "✅ App installed to /Applications"

          echo "===== Step 3/6: Launch app ====="
          echo "▶️ Launching $APP_NAME.app ..."
          script -q /dev/null "open" -a "/Applications/$APP_NAME.app" > "$LOG" 2>&1 &
          sleep 5
          PID=$(pgrep -f "$APP_NAME.app" | head -1)
          echo "Launch PID=$PID"

          echo "⏳ Polling port $PORT (max 60s)..."
          UP=0
          for i in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:$PORT/" -o /dev/null 2>/dev/null; then
              echo "✅ Server up after ${i}s"
              UP=1
              break
            fi
            sleep 1
          done

          if [ "$UP" != "1" ]; then
            echo "❌ HTTP endpoint timeout"
            tail -100 "$LOG" || true
            screencapture -x -t png "$RUNNER_TEMP/electron-verify/01-server-failed.png" 2>/dev/null || true
            pkill -f "$APP_NAME.app" 2>/dev/null || true
            exit 1
          fi

          echo "===== Step 4/6: Verify HTTP service ====="
          curl -fsS -o "$RUNNER_TEMP/electron-verify/home.html" "http://127.0.0.1:$PORT/"
          curl -fsS -o "$RUNNER_TEMP/electron-verify/dashboard.html" "http://127.0.0.1:$PORT/dashboard" || echo "⚠️ /dashboard not 2xx"
          echo "✅ HTTP service verified"

          echo "===== Step 5/6: Screenshots ====="
          screencapture -x -t png "$RUNNER_TEMP/electron-verify/01-app-running.png" 2>/dev/null || true
          open -ga "/Applications/$APP_NAME.app" 2>/dev/null || true
          sleep 3
          screencapture -x -t png "$RUNNER_TEMP/electron-verify/02-app-opened.png" 2>/dev/null || true
          echo "✅ Screenshots captured"

          echo "===== Step 6/6: Cleanup ====="
          tail -30 "$LOG" || true
          cp "$LOG" "$RUNNER_TEMP/electron-verify/server.log" 2>/dev/null || true
          pkill -f "$APP_NAME.app" 2>/dev/null || true
          echo "✅ Electron macOS E2E verification passed"

      - name: 📸 Upload Electron macOS verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electron-macos-verification-${{ steps.ver.outputs.version }}
          path: ${{ runner.temp }}/electron-verify/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload macOS Electron artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-electron
          path: "${{ env.APP_NAME }}-${{ steps.ver.outputs.version }}-macos-arm64-electron.dmg"
          if-no-files-found: error

  # =====================================================================
  # 7. Windows x64 Tauri 构建
  # =====================================================================
  build-windows-tauri:
    name: Build Windows (x64) Tauri
    needs: build-cli
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download CLI bundle
        uses: actions/download-artifact@v4
        with:
          name: cli-bundle
          path: .

      - name: Extract CLI bundle
        shell: bash
        run: tar -xzf cli-bundle.tar.gz

      - name: Read app version
        id: ver
        shell: pwsh
        run: |
          $pkg = Get-Content cli/package.json | ConvertFrom-Json
          "version=$($pkg.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Download portable Node.js
        shell: pwsh
        run: |
          $ver = "${{ env.PORTABLE_NODE_VERSION }}"
          $url = "https://nodejs.org/dist/v$ver/node-v$ver-win-x64.zip"
          Invoke-WebRequest -Uri $url -OutFile node.zip
          Expand-Archive node.zip -DestinationPath .
          Rename-Item "node-v$ver-win-x64" "node-portable"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        shell: pwsh
        run: npm install -g @tauri-apps/cli@^1.5 2>$null

      - name: Generate icons for Tauri
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $srcPng = "assemblyai-color.png"
          if(-not (Test-Path $srcPng)) {
            Write-Host "Generating default icon..."
            $bmp = New-Object System.Drawing.Bitmap(512, 512)
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.Clear([System.Drawing.Color]::FromArgb(51, 153, 51))
            $g.Dispose()
            $bmp.Save($srcPng, [System.Drawing.Imaging.ImageFormat]::Png)
            $bmp.Dispose()
          }
          $tauriIcons = "src-tauri/icons"
          New-Item -ItemType Directory -Force -Path $tauriIcons | Out-Null
          $sizes = @(32, 128)
          foreach($s in $sizes) {
            $bmp = New-Object System.Drawing.Bitmap($s, $s)
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
            $img = [System.Drawing.Image]::FromFile($srcPng)
            $g.DrawImage($img, 0, 0, $s, $s)
            $g.Dispose()
            $img.Dispose()
            $bmp.Save("$tauriIcons/${s}x${s}.png", [System.Drawing.Imaging.ImageFormat]::Png)
            $bmp.Dispose()
          }
          Copy-Item "$tauriIcons/32x32.png" "$tauriIcons/icon.png" -Force
          # 生成 ICO
          New-Item -ItemType Directory -Force -Path "build" | Out-Null
          $fs = New-Object System.IO.FileStream("$tauriIcons/icon.ico", [System.IO.FileMode]::Create)
          $bw = New-Object System.IO.BinaryWriter($fs)
          $allSizes = @(16, 32, 48, 64, 128, 256)
          $count = $allSizes.Count
          $bw.Write([UInt16]0)
          $bw.Write([UInt16]1)
          $bw.Write([UInt16]$count)
          $offset = 6 + ($count * 16)
          for($i=0; $i -lt $count; $i++) {
            $size = $allSizes[$i]
            $pngPath = "build/icon-$size.png"
            if(-not (Test-Path $pngPath)) {
              $bmp = New-Object System.Drawing.Bitmap($size, $size)
              $g = [System.Drawing.Graphics]::FromImage($bmp)
              $g.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
              $img = [System.Drawing.Image]::FromFile($srcPng)
              $g.DrawImage($img, 0, 0, $size, $size)
              $g.Dispose()
              $img.Dispose()
              $bmp.Save($pngPath, [System.Drawing.Imaging.ImageFormat]::Png)
              $bmp.Dispose()
            }
            $pngBytes = [System.IO.File]::ReadAllBytes($pngPath)
            $sizeByte = if($size -ge 256) { [Byte]0 } else { [Byte]$size }
            $bw.Write($sizeByte)
            $bw.Write($sizeByte)
            $bw.Write([Byte]0)
            $bw.Write([Byte]0)
            $bw.Write([UInt16]1)
            $bw.Write([UInt16]32)
            $bw.Write([UInt32]$pngBytes.Length)
            $bw.Write([UInt32]$offset)
            $offset += $pngBytes.Length
          }
          for($i=0; $i -lt $count; $i++) {
            $size = $allSizes[$i]
            $pngPath = "build/icon-$size.png"
            $pngBytes = [System.IO.File]::ReadAllBytes($pngPath)
            $bw.Write($pngBytes)
          }
          $bw.Close()
          $fs.Close()
          Write-Host "✅ Tauri icons generated"

      - name: Prepare Tauri resources
        shell: pwsh
        run: |
          $resDir = "src-tauri/resources"
          New-Item -ItemType Directory -Force -Path "$resDir/cli" | Out-Null
          New-Item -ItemType Directory -Force -Path "$resDir/node" | Out-Null

          Copy-Item cli/cli.js "$resDir/cli/"
          Copy-Item cli/package.json "$resDir/cli/"
          if (Test-Path cli/LICENSE) { Copy-Item cli/LICENSE "$resDir/cli/" }
          if (Test-Path cli/README.md) { Copy-Item cli/README.md "$resDir/cli/" }
          Copy-Item -Recurse cli/src "$resDir/cli/src"
          Copy-Item -Recurse cli/hooks "$resDir/cli/hooks"
          Copy-Item -Recurse cli/app "$resDir/cli/app"
          if (Test-Path cli/node_modules) {
            Copy-Item -Recurse cli/node_modules "$resDir/cli/node_modules"
          }
          Copy-Item -Recurse "node-portable/*" "$resDir/node/"

      - name: Build Tauri MSI
        shell: pwsh
        run: |
          tauri build --bundles msi

      - name: Rename artifact
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          $src = Get-ChildItem src-tauri/target/release/bundle/msi/*.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($src) {
            $dst = "${{ env.APP_NAME }}-$ver-windows-x64-tauri.msi"
            Move-Item $src.FullName $dst
          }

      - name: Upload Windows Tauri artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-tauri
          path: "${{ env.APP_NAME }}-${{ steps.ver.outputs.version }}-windows-x64-tauri.msi"
          if-no-files-found: error

  # =====================================================================
  # 8. macOS arm64 Tauri 构建
  # =====================================================================
  build-macos-tauri:
    name: Build macOS (arm64) Tauri
    needs: build-cli
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download CLI bundle
        uses: actions/download-artifact@v4
        with:
          name: cli-bundle
          path: .

      - name: Extract CLI bundle
        run: tar -xzf cli-bundle.tar.gz

      - name: Read app version
        id: ver
        run: |
          ver=$(node -e "console.log(require('./cli/package.json').version)")
          echo "version=$ver" >> $GITHUB_OUTPUT

      - name: Download portable Node.js
        run: |
          ver="${{ env.PORTABLE_NODE_VERSION }}"
          curl -fsSLO "https://nodejs.org/dist/v$ver/node-v$ver-darwin-arm64.tar.gz"
          tar -xzf "node-v$ver-darwin-arm64.tar.gz"
          mv "node-v$ver-darwin-arm64" node-portable

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^1.5

      - name: Generate icons for Tauri
        run: |
          set -e
          if [ ! -f "assemblyai-color.png" ]; then
            echo "Generating default icon..."
            python3 scripts/generate-icons.py .
          fi
          python3 scripts/generate-tauri-icons.py assemblyai-color.png src-tauri/icons /tmp/tauri-icon-temp

      - name: Verify Tauri icons
        run: |
          set -e
          echo "=== Verifying Tauri icons ==="
          for f in icon.png icon.ico icon.icns 32x32.png 128x128.png; do
            if [ ! -f "src-tauri/icons/$f" ]; then
              echo "ERROR: Missing icon: $f"
              exit 1
            fi
            echo "  OK src-tauri/icons/$f ($(stat -f%z src-tauri/icons/$f 2>/dev/null || wc -c < src-tauri/icons/$f) bytes)"
          done
          echo "All icons verified!"

      - name: Ensure dist directory exists
        run: |
          if [ ! -d "src-tauri/dist" ] || [ ! -f "src-tauri/dist/index.html" ]; then
            echo "Creating minimal dist for Tauri..."
            mkdir -p src-tauri/dist
            echo '<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>One</title><style>body{margin:0;display:flex;justify-content:center;align-items:center;height:100vh;background:#1a1a1a;color:#666;font-family:system-ui,sans-serif}</style></head><body><div>Loading One...</div></body></html>' > src-tauri/dist/index.html
          fi
          ls -la src-tauri/dist/

      - name: Prepare Tauri resources
        run: |
          resDir="src-tauri/resources"
          mkdir -p "$resDir/cli" "$resDir/node"
          cp cli/cli.js "$resDir/cli/"
          cp cli/package.json "$resDir/cli/"
          [ -f cli/LICENSE ] && cp cli/LICENSE "$resDir/cli/"
          [ -f cli/README.md ] && cp cli/README.md "$resDir/cli/"
          cp -R cli/src "$resDir/cli/src"
          cp -R cli/hooks "$resDir/cli/hooks"
          cp -R cli/app "$resDir/cli/app"
          [ -d cli/node_modules ] && cp -R cli/node_modules "$resDir/cli/node_modules"
          cp -R node-portable/* "$resDir/node/"
          echo "=== Resources prepared ==="
          ls -la "$resDir/"
          ls -la "$resDir/cli/"
          ls -la "$resDir/node/"

      - name: Build Tauri DMG
        run: |
          echo "=== Starting Tauri build ==="
          echo "Tauri version: $(tauri --version 2>/dev/null || echo 'unknown')"
          echo "Rust version: $(rustc --version)"
          echo "Node version: $(node --version)"
          echo "Cargo version: $(cargo --version)"
          echo "---"
          echo "Tauri config:"
          cat src-tauri/tauri.conf.json
          echo "---"
          echo "Cargo config:"
          cat src-tauri/Cargo.toml
          echo "---"
          tauri build --bundles dmg 2>&1 | tee tauri-build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          if [ "$BUILD_EXIT" != "0" ]; then
            echo "ERROR: Tauri build failed with exit code $BUILD_EXIT"
            echo "=== Last 100 lines of build log ==="
            tail -100 tauri-build.log
            echo "=== Full build log ==="
            cat tauri-build.log
            exit $BUILD_EXIT
          fi
          echo "=== Tauri build completed ==="
          ls -la src-tauri/target/release/bundle/dmg/
          ls -la src-tauri/target/release/bundle/macos/ 2>/dev/null || true

      - name: Rename artifact
        run: |
          ver="${{ steps.ver.outputs.version }}"
          src=$(find src-tauri/target/release/bundle/dmg -name "*.dmg" -print -quit)
          if [ -n "$src" ]; then
            dst="${{ env.APP_NAME }}-$ver-macos-arm64-tauri.dmg"
            mv "$src" "$dst"
          fi

      - name: 🔍 Verify Tauri DMG by mounting
        run: |
          set -e
          VER="${{ steps.ver.outputs.version }}"
          APP="${{ env.APP_NAME }}"
          DMG="$(pwd)/$APP-$VER-macos-arm64-tauri.dmg"
          echo "DMG path: $DMG"
          ls -la "$DMG"
          RAW=$(hdiutil attach "$DMG" -nobrowse -readonly 2>&1)
          echo "hdiutil output:"
          echo "$RAW"
          # Try the simple awk parsing first; fallback to grep-based lookup
          MOUNTPOINT=$(echo "$RAW" | tail -1 | awk '{print $3}')
          if [ -z "$MOUNTPOINT" ] || [ ! -d "$MOUNTPOINT" ]; then
            DEV=$(echo "$RAW" | head -1 | awk '{print $1}')
            echo "Primary parsing failed (MOUNTPOINT=$MOUNTPOINT DEV=$DEV); falling back to mount lookup"
            MOUNTPOINT=$(mount | grep -F "$DEV" | awk '{print $3}')
          fi
          if [ -z "$MOUNTPOINT" ] || [ ! -d "$MOUNTPOINT" ]; then
            # Final fallback: search /Volumes for our .app
            MOUNTPOINT=""
            for p in /Volumes/*; do
              if [ -d "$p/$APP.app" ]; then MOUNTPOINT="$p"; break; fi
            done
          fi
          echo "Mounted at: $MOUNTPOINT"
          test -n "$MOUNTPOINT" || { echo "❌ Failed to resolve mount point"; exit 1; }
          test -d "$MOUNTPOINT/$APP.app" || { echo "❌ $APP.app missing inside DMG"; hdiutil detach "$MOUNTPOINT"; exit 1; }
          codesign --verify --verbose=2 "$MOUNTPOINT/$APP.app" || echo "⚠️ signature verify reported issues"
          for f in "Contents/MacOS/$APP" "Contents/Info.plist"; do
            test -e "$MOUNTPOINT/$APP.app/$f" && echo "✅ $f" || echo "⚠️ Missing: $f"
          done
          hdiutil detach "$MOUNTPOINT"
          echo "✅ Tauri DMG internal structure verification passed"

      - name: 🔥 Tauri macOS E2E Verification
        id: e2e-tauri
        run: |
          set +e
          VER="${{ steps.ver.outputs.version }}"
          APP_NAME="${{ env.APP_NAME }}"
          DMG="$(pwd)/$APP_NAME-$VER-macos-arm64-tauri.dmg"
          PORT=20128
          LOG="$RUNNER_TEMP/tauri-server.log"
          mkdir -p "$RUNNER_TEMP/tauri-verify"

          echo "===== Step 1/6: Mount DMG ====="
          RAW=$(hdiutil attach "$DMG" -nobrowse -readonly 2>&1)
          echo "hdiutil output: $RAW"
          MOUNTPOINT=$(echo "$RAW" | tail -1 | awk '{print $3}')
          if [ -z "$MOUNTPOINT" ] || [ ! -d "$MOUNTPOINT" ]; then
            DEV=$(echo "$RAW" | head -1 | awk '{print $1}')
            MOUNTPOINT=$(mount | grep -F "$DEV" | awk '{print $3}')
          fi
          if [ -z "$MOUNTPOINT" ] || [ ! -d "$MOUNTPOINT" ]; then
            for p in /Volumes/*; do
              if [ -d "$p/$APP_NAME.app" ]; then MOUNTPOINT="$p"; break; fi
            done
          fi
          if [ -z "$MOUNTPOINT" ] || [ ! -d "$MOUNTPOINT" ]; then
            echo "❌ Cannot mount DMG"
            exit 1
          fi
          echo "✅ DMG mounted: $MOUNTPOINT"

          echo "===== Step 2/6: Copy app to /Applications ====="
          sudo rm -rf "/Applications/$APP_NAME.app" 2>/dev/null || true
          cp -R "$MOUNTPOINT/$APP_NAME.app" /Applications/
          hdiutil detach "$MOUNTPOINT"
          echo "✅ App installed to /Applications"

          echo "===== Step 3/6: Launch app ====="
          echo "▶️ Launching $APP_NAME.app ..."
          script -q /dev/null "open" -a "/Applications/$APP_NAME.app" > "$LOG" 2>&1 &
          sleep 5
          PID=$(pgrep -f "$APP_NAME.app" | head -1)
          echo "Launch PID=$PID"

          echo "⏳ Polling port $PORT (max 60s)..."
          UP=0
          for i in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:$PORT/" -o /dev/null 2>/dev/null; then
              echo "✅ Server up after ${i}s"
              UP=1
              break
            fi
            sleep 1
          done

          if [ "$UP" != "1" ]; then
            echo "❌ HTTP endpoint timeout"
            tail -100 "$LOG" || true
            screencapture -x -t png "$RUNNER_TEMP/tauri-verify/01-server-failed.png" 2>/dev/null || true
            pkill -f "$APP_NAME.app" 2>/dev/null || true
            exit 1
          fi

          echo "===== Step 4/6: Verify HTTP service ====="
          curl -fsS -o "$RUNNER_TEMP/tauri-verify/home.html" "http://127.0.0.1:$PORT/"
          curl -fsS -o "$RUNNER_TEMP/tauri-verify/dashboard.html" "http://127.0.0.1:$PORT/dashboard" || echo "⚠️ /dashboard not 2xx"
          echo "✅ HTTP service verified"

          echo "===== Step 5/6: Screenshots ====="
          screencapture -x -t png "$RUNNER_TEMP/tauri-verify/01-app-running.png" 2>/dev/null || true
          open -ga "/Applications/$APP_NAME.app" 2>/dev/null || true
          sleep 3
          screencapture -x -t png "$RUNNER_TEMP/tauri-verify/02-app-opened.png" 2>/dev/null || true
          echo "✅ Screenshots captured"

          echo "===== Step 6/6: Cleanup ====="
          tail -30 "$LOG" || true
          cp "$LOG" "$RUNNER_TEMP/tauri-verify/server.log" 2>/dev/null || true
          pkill -f "$APP_NAME.app" 2>/dev/null || true
          echo "✅ Tauri macOS E2E verification passed"

      - name: 📸 Upload Tauri macOS verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-macos-verification-${{ steps.ver.outputs.version }}
          path: ${{ runner.temp }}/tauri-verify/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload macOS Tauri artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-tauri
          path: "${{ env.APP_NAME }}-${{ steps.ver.outputs.version }}-macos-arm64-tauri.dmg"
          if-no-files-found: error

  # =====================================================================
  # 9. 创建/更新 GitHub Release，附带所有产物
  # =====================================================================
  release:
    name: Publish Release
    needs: [build-windows, build-macos, build-windows-electron, build-macos-electron, build-windows-tauri, build-macos-tauri]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: List artifacts
        run: ls -lah dist

      - name: Create / update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/**/*.zip
            dist/**/*.msi
            dist/**/*.dmg
            dist/**/*.exe
